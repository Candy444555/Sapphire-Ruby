name: Build Lexi Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'artifacts/lexi-mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      CI: true
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: 
        with:
          version: 

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install workspace dependencies (hoisted for RN bundler resolution)
        env:
          NPM_CONFIG_NODE_LINKER: hoisted
          NPM_CONFIG_SHAMEFULLY_HOIST: "true"
        run: pnpm install --no-frozen-lockfile --config.node-linker=hoisted --config.shamefully-hoist=true

      - name: Expo prebuild (generate android/)
        working-directory: artifacts/lexi-mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Hard-patch expo-router _ctx.*.js with literal app root
        working-directory: artifacts/lexi-mobile
        run: |
          # Bypass the babel/caller routerRoot inference entirely. Metro's
          # require.context validator demands STRING LITERALS, and the
          # babel-preset-expo expo-router plugin failed to inline them under
          # gradle's bundle invocation. We rewrite the source files directly.
          python3 - <<'PY'
          import pathlib, re
          for name in ("_ctx.android.js", "_ctx.ios.js", "_ctx.web.js", "_ctx.js"):
              p = pathlib.Path("node_modules/expo-router") / name
              if not p.exists():
                  continue
              s = p.read_text()
              # Replace the env vars with literal values metro can statically read.
              # Path from node_modules/expo-router → ../../app
              new = s.replace("process.env.EXPO_ROUTER_APP_ROOT", '"../../app"')
              new = new.replace("process.env.EXPO_ROUTER_IMPORT_MODE", '"sync"')
              if new != s:
                  p.write_text(new)
                  print(f"patched {p}")
                  print(new)
          PY

      - name: Build release APK
        working-directory: artifacts/lexi-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        working-directory: artifacts/lexi-mobile/android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Found: $APK"
          ls -la "$APK"
          echo "apk_path=artifacts/lexi-mobile/android/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexi-mobile-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
