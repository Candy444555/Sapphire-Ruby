<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Uncensored AI Chat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function hideReplitBadge() {
        var css = '\n          [data-replit-metadata*="dev-banner"], iframe[src*="replit-dev-banner"],\n          iframe[src*="replit.com/badge"], iframe[src*="replit.dev/__replco"],\n          [data-replit-badge], #replit-badge, .replit-badge, .__replco-dev-banner,\n          a[href*="replit.com/@"], a[href*="replit.com/replid"] {\n            display: none !important; visibility: hidden !important; opacity: 0 !important;\n            pointer-events: none !important; height: 0 !important; width: 0 !important;\n          }\n        ';
        var style = document.createElement('style');
        style.id = '__hide-replit-badge';
        style.appendChild(document.createTextNode(css));
        document.documentElement.appendChild(style);
        var sweep = function () {
          document.querySelectorAll('iframe').forEach(function (f) {
            var src = f.getAttribute('src') || '';
            if (/replit\.(com|dev).*(badge|banner|__replco)/i.test(src)) f.remove();
          });
        };
        sweep();
        new MutationObserver(sweep).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
